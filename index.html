<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Series LED TV | Premium Visual Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="App">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo" onclick="navigateTo('home')">
                    <img src="logo.jpeg" alt="M-Series Logo" style="height: 40px; width: auto;">
                </div>
                <div class="nav-menu" id="navMenu">
                    <div class="nav-link" onclick="navigateTo('home')">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </div>
                    <div class="nav-link" onclick="navigateTo('about')">
                        <i class="fas fa-info-circle"></i>
                        <span>About</span>
                    </div>
                    <div class="nav-link" onclick="navigateTo('catalogue')">
                        <i class="fas fa-tv"></i>
                        <span>Catalogue</span>
                    </div>
                    <div class="nav-link" id="authLink" onclick="handleAuth()">
                        <i class="fas fa-user"></i>
                        <span id="authText">Login</span>
                    </div>
                    <div class="nav-link" onclick="location.href='cart.html'">
                        <i class="fas fa-shopping-cart"></i>
                        <span>Cart <span id="cart-count" class="cart-badge">0</span></span>
                    </div>
                </div>
                <div class="nav-toggle" onclick="toggleMenu()">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </nav>

        <main class="main-content" id="mainContent"></main>

        <footer class="footer">
            <div class="footer-container">
                <div class="footer-section">
                    <h3><img src="logo1.jpeg" alt="M-Series Logo" style="height: 30px; width: auto; margin-right: 10px;"> M-Series</h3>
                    <p>Premium LED TVs for the ultimate viewing experience.</p>
                </div>
                <div class="footer-section">
                    <h4>Quick Links</h4>
                    <a onclick="navigateTo('home')">Home</a>
                    <a onclick="navigateTo('about')">About</a>
                    <a onclick="navigateTo('catalogue')">Catalogue</a>
                </div>
                <div class="footer-section">
                    <h4>Contact Us</h4>
                    <p><i class="fas fa-phone"></i> +91 1234567890</p>
                    <p><i class="fas fa-envelope"></i> support@mseries.com</p>
                </div>
                <div class="footer-section">
                    <h4>Follow Us</h4>
                    <div class="social-links">
                        <i class="fab fa-facebook"></i>
                        <i class="fab fa-twitter"></i>
                        <i class="fab fa-instagram"></i>
                        <i class="fab fa-youtube"></i>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 M-Series LED TV. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        function handleAuth() { window.location.href = 'login.html'; }
        fetch('api/check_session.php')
            .then(res => res.json())
            .then(data => {
                if (data.logged_in) {
                    document.getElementById('authText').innerText = 'My Account';
                    document.getElementById('authLink').onclick = () => {
                        if (data.role === 'admin') window.location.href = 'admin.html';
                        else window.location.href = 'my_orders.html';
                    };
                }
            });
    </script>
</body>
</html>
